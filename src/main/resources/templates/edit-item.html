<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GroceryFlow | Edit Item</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 27px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
        }

        input {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #059669;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button,
        .cancel {
            padding: 10px 17px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }

        button {
            background: #059669;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Edit Inventory Item</h1>

        <p>
            Update the details of your grocery item.
        </p>

    </div>


    <div class="card">

        <form th:action="@{/items/update/{id}(id=${item.id})}"
              th:object="${item}"
              method="post">

            <div class="form-grid">

                <div class="form-group">

                    <label>Item Name</label>

                    <input type="text"
                           th:field="*{name}"
                           required>

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <input type="text"
                           th:field="*{category}">

                </div>


                <div class="form-group">

                    <label>Quantity</label>

                    <input type="number"
                           th:field="*{quantity}"
                           required>

                </div>


                <div class="form-group">

                    <label>Unit</label>

                    <input type="text"
                           th:field="*{unit}">

                </div>


                <div class="form-group">

                    <label>Price</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           required>

                </div>


                <div class="form-group">

                    <label>Reorder Level</label>

                    <input type="number"
                           th:field="*{reorderLevel}">

                </div>

            </div>


            <div class="actions">

                <a href="/items"
                   class="cancel">
                    Cancel
                </a>

                <button type="submit">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
